[package]
name = "rc-port-hil"
description = "On-target bench programs for the rc-port work. rc_capture listens to the receiver's line; run with tools/run.sh rc_capture 600."
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "hil_common"

[dependencies]
# rc_capture decodes only to count, and does not use rc-port: it must not depend on what it measures.
# rc_follow runs rc-port itself, on the unsplit embassy-rp 0.10 BufferedUart.
rc-port = { path = "..", features = ["embassy-rp-0-10"] }
crsf-codec = { git = "https://github.com/Lmx154/crsf-codec.git", rev = "61a087889395e5c63bb73f80d2dde678f22f95a7" }
mavlink-device = { git = "https://github.com/Lmx154/mavlink-device.git", rev = "dfdb11a03ac3c8a28792c4f23ee3cd6ca045a93c" }
# The same source and commit as mavlink-device's own dependency, so that both use one copy.
marv-dialect = { git = "https://github.com/Lmx154/marv-dialect.git", rev = "af6baa107046219dee49cd88c81f9809c134e761" }
# rc_link only, for marv::MARV_TEST_DATA (id 42420): the newer commit with the marv dialect, as a second,
# renamed copy. Both depend on mavlink-core =0.21.0, so MessageData is one trait for both.
marv-dialect-new = { package = "marv-dialect", git = "https://github.com/Lmx154/marv-dialect.git", rev = "e49c15f44a8e0e74dbf0da71ea9724049bb5845b" }
pio-uart = { path = "../../pio-uart", features = ["defmt", "embassy-rp-0-10"] }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb", "binary-info"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.1"
embedded-io-async = "0.7"
static_cell = "2.1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
semihosting = "0.1"

[profile.release]
debug = true

[workspace]
