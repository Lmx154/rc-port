[package]
name = "rc-port"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The UART of an ExpressLRS receiver on a flight controller, following the receiver between CRSF at 420000 baud and MAVLink 2 at 460800 baud: a sans-IO core and an async loop over embedded-io-async."
readme = "README.md"
keywords = ["embedded", "no-std", "crsf", "mavlink", "expresslrs"]
categories = ["embedded", "no-std"]
rust-version = "1.99"

[features]
# SetBaud and TxBusy for the unsplit embassy-rp 0.10 BufferedUart. The chip feature (rp235xa/rp235xb) comes from the application.
embassy-rp-0-10 = ["dep:embassy-rp"]

[dependencies]
# Both siblings from GitHub, pinned to a commit, so that the crate builds from git alone and an application
# that pins the same commits gets one copy of each. To take a newer one: change `rev` here and in
# hil/Cargo.toml, then `cargo update -p <crate>`. To work on a sibling locally, override it without editing
# this file: [patch."https://github.com/Lmx154/mavlink-device.git"] mavlink-device = { path = "../mavlink-device" }
crsf-codec = { git = "https://github.com/Lmx154/crsf-codec.git", rev = "2d12a55246ba1b0729c65004c6012015760da1d2" }
mavlink-device = { git = "https://github.com/Lmx154/mavlink-device.git", rev = "dfdb11a03ac3c8a28792c4f23ee3cd6ca045a93c" }
# The same source and commit as mavlink-device's own dependency, so that both use one copy.
marv-dialect = { git = "https://github.com/Lmx154/marv-dialect.git", rev = "af6baa107046219dee49cd88c81f9809c134e761" }
embedded-io-async = "0.7"
embedded-hal-async = "1.0"
embassy-rp = { version = "0.10.0", default-features = false, optional = true }

[workspace]
exclude = ["hil"]

[dev-dependencies]
proptest = "1.12"
